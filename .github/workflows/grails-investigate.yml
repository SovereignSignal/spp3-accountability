name: grails diagnostics
on:
  pull_request:
    paths: [".github/workflows/grails-investigate.yml"]
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Archive inspected source
        run: |
          mkdir -p /tmp/grails-diagnostics
          git archive HEAD -o /tmp/grails-diagnostics/source.tar
      - name: Read-only RPC diagnostics
        run: |
          python - <<'PY'
          import sys,json,pathlib,urllib.request,urllib.parse
          sys.path.insert(0,'scripts')
          import grails_chain as G
          from chain import Chain
          out=pathlib.Path('/tmp/grails-diagnostics')
          c=Chain(); c.timeout=8
          results=[]
          def call(label,method,params):
              try:
                  value=c._rpc(method,params)
                  results.append({'label':label,'method':method,'params':params,'result':value})
                  print(label, 'rows='+str(len(value)) if isinstance(value,list) else 'ok',flush=True)
                  return value
              except Exception as exc:
                  results.append({'label':label,'error_type':type(exc).__name__})
                  print(label,type(exc).__name__,flush=True)
          left,right=25970000,25970200
          common={'fromBlock':hex(left),'toBlock':hex(right)}
          call('combined-filter','eth_getLogs',[dict(common,address=[G.CONTROLLER,G.HELPER],topics=[[G.REGISTERED,G.RENEWED,G.REFERRED]])])
          for name,addr,sig in [('register',G.CONTROLLER,G.REGISTERED),('renew',G.CONTROLLER,G.RENEWED),('helper',G.HELPER,G.REFERRED)]:
              call(name,'eth_getLogs',[dict(common,address=addr,topics=[sig])])
              call(name+'-code','eth_getCode',[addr,'latest'])
          sales=json.load(open('data/grails/sales.json'))['events']
          for e in sales:
              if int(e['amount_raw'])>0:
                  call('sale-transaction-'+e['key'],'eth_getTransactionByHash',[e['transaction_hash']])
          for url,label in [('https://api.grails.app/api/v1/analytics/sales?period=all&source=grails&sortBy=date&sortOrder=desc&page=1&limit=100','api-sales'),('https://eth.blockscout.com/api/v2/addresses/'+G.CONTROLLER+'/logs','explorer-controller'),('https://eth.blockscout.com/api/v2/addresses/'+G.HELPER+'/logs','explorer-helper')]:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'SPP3Accountability/1.0'}),timeout=20) as r: value=json.load(r)
                  (out/(label+'.json')).write_text(json.dumps(value))
                  print(label,'ok',flush=True)
              except Exception as exc: print(label,type(exc).__name__,flush=True)
          (out/'rpc.json').write_text(json.dumps(results))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grails-diagnostics-${{ github.run_id }}
          path: /tmp/grails-diagnostics
          retention-days: 30
