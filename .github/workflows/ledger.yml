name: refresh ledger
on:
  workflow_dispatch:
  schedule:
    - cron: "3 15 * * *"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          git config user.name "spp3-accountability[bot]"
          git config user.email "spp3-accountability[bot]@users.noreply.github.com"
          python scripts/ledger.py
