name: refresh ledger
on:
  workflow_dispatch:
  schedule:
    - cron: "3 15 * * *"
  push:
    branches: [master]
    paths:
      - "scripts/ledger.py"
      - "scripts/chain.py"
      - "data/providers.json"
      - "data/commitments.json"
      - ".github/workflows/ledger.yml"
  pull_request:
    paths:
      - "scripts/ledger.py"
      - "scripts/chain.py"
      - "data/providers.json"
      - "data/commitments.json"
      - ".github/workflows/ledger.yml"

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/ledger.py --dry-run

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # One production refresh at a time; a queued run waits rather than racing
    # the running one to push. Not shared with grails.yml: GitHub cancels older
    # pending runs within a group, which would drop a scheduled refresh.
    concurrency:
      group: ledger-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          git config user.name "spp3-accountability[bot]"
          git config user.email "spp3-accountability[bot]@users.noreply.github.com"
          python scripts/ledger.py
